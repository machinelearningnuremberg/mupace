[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mupace"
version = "0.1.0"
description = "Fine-tune Qwen models with LoRA, no tuning needed: Muon plus a frozen learned learning-rate scheduler (MuPACE)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jan Kobiolka" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "torch>=2.6",
    "transformers>=5.21.0",
    "accelerate>=0.26",
    "datasets>=2.19",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
jax = ["jax>=0.4.30"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mupace.assets" = ["scheduler_theta.npz", "scheduler_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
